name: visual-regression

on:
  pull_request:
  workflow_dispatch:

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Start app
        run: npm run serve -- --port 4173 > /tmp/serve.log 2>&1 &

      - name: Wait for app
        run: npx wait-on http://127.0.0.1:4173

      - name: Run visual regression
        run: npm run visual:regression

      - name: Upload visual artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-artifacts
          path: |
            tests/visual/current
            tests/visual/diff
            tests/visual/report.json
            /tmp/serve.log
